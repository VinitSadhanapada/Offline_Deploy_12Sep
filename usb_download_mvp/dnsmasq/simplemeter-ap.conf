
# dnsmasq configuration for the AP on wlan0
# Provides DHCP addresses for clients connecting to the AP
interface=wlan0
bind-interfaces
domain-needed
bogus-priv
# DHCP range: .10 - .200, 12 hour leases
dhcp-range=192.168.50.10,192.168.50.200,12h
# Default gateway option (router)
dhcp-option=3,192.168.50.1

